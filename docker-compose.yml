version: '3.8'

services:
  hugo:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    volumes:
      - .:/src
    command: sh -c "cd /src && hugo server --bind 0.0.0.0 --port 8080 --watch --disableFastRender -D"
    profiles:
      - dev

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    restart: unless-stopped

  # For development with hot reload
  hugo-dev:
    image: hugo:0.164.0-extended-alpine
    ports:
      - "1313:1313"
    volumes:
      - .:/src
    working_dir: /src
    command: sh -c "apk add git && hugo server --bind 0.0.0.0 --port 1313 --watch --disableFastRender -D"
    profiles:
      - dev